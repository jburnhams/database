[project]
name = "omarchy-db"
version = "0.1.0"
description = "One shared PostgreSQL with a schema per app: connect, SQLAlchemy dataclass models, Alembic migrations, dbtool, pytest fixtures (SQLite or Postgres)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dbtool = "omarchy_db.cli:main"

[project.entry-points.pytest11]
omarchy_db = "omarchy_db.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omarchy_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
