[project]
name = "notes"
version = "0.1.0"
description = "Example app for omarchy_db: models, autogenerated migrations, tests on SQLite and Postgres"
requires-python = ">=3.11"
dependencies = ["omarchy-db"]

[tool.uv.sources]
omarchy-db = { path = "../../python", editable = true }

[tool.omarchy-db]
app = "notes"
models = "notes.models:Base"
migrations = "migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes"]
